# Android IME — final pins (2026-09-03)
# Gradle Wrapper: 9.5.0   (gradle/wrapper/gradle-wrapper.properties)
# compileSdk = 36
# targetSdk  = 36          # Google Play requirement >= 36
# minSdk     = 31          # Android 12+ baseline
# JDK daemon = 21          # AGP compilation requirement
# ndk.abiFilters = ["arm64-v8a"]

[versions]
agp                    = "9.1.1"
kotlin                 = "2.4.20"
ksp                    = "2.3.11"

coroutines             = "1.11.0"
serialization-json     = "1.11.0"

appcompat              = "1.8.0"
constraintlayout       = "2.2.2"
material               = "1.14.0"
recyclerview           = "1.4.0"
emoji2                 = "1.6.0"
preference             = "1.2.1"
room                   = "2.8.4"
lifecycle              = "2.11.0"
activity               = "1.13.0"
fragment               = "1.9.0"
navigation             = "2.9.6"
flexbox                = "3.0.0"

onnxruntime            = "1.29.0"
# sherpa-onnx         = "1.13.7" (vendored in app/libs)

cropper                = "4.7.0"

junit4                 = "4.13.2"
test-ext-junit         = "1.3.0"
test-runner            = "1.7.0"
uiautomator            = "2.4.0"

profileinstaller       = "1.4.1"
# androidx.baselineprofile plugin and androidx.benchmark libraries are released in lockstep under this version
benchmark              = "1.5.0"

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
android-test           = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize       = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }

appcompat                   = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout            = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
material                    = { module = "com.google.android.material:material", version.ref = "material" }
recyclerview                = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
emoji2                      = { module = "androidx.emoji2:emoji2", version.ref = "emoji2" }
emoji2-views                = { module = "androidx.emoji2:emoji2-views", version.ref = "emoji2" }
preference-ktx              = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
navigation-fragment-ktx     = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx           = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
room-runtime                = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler", version.ref = "room" }
lifecycle-runtime-ktx       = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-ktx                = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
fragment-ktx                = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
google-flexbox              = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }

profileinstaller            = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4      = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
onnxruntime-android         = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
image-cropper               = { module = "com.vanniktech:android-image-cropper", version.ref = "cropper" }

junit4                      = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext-junit     = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
androidx-test-runner        = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-uiautomator   = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
