__build_info:
  rime_version: 1.17.0
  timestamps:
    default: 1789272582
    default.custom: 0
    t9_pinyin.custom: 0
    t9_pinyin.schema: 1790177865
emoji:
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@traditionalize"
    - "simplifier@emoji"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
menu:
  page_size: 15
schema:
  author:
    - "Bitfennec & RIME Developers"
  description: |
    LIME 拼音九键输入方案（纯数字23456789编码）

  name: "拼音九键"
  schema_id: t9_pinyin
  version: 1.3
speller:
  algebra:
    - "erase/^xx$/"
    - "abbrev/^([zcs]h).+$/$1/"
    - "derive/^([nl])ve$/$1ue/"
    - "derive/^([jqxy])u/$1v/"
    - "derive/un$/uen/"
    - "derive/ui$/uei/"
    - "derive/iu$/iou/"
    - "derive/([dtngkhrzcs])o(u|ng)$/$1o/"
    - "derive/ong$/on/"
    - "xform/^m$/mu/"
    - "xform/^n$/en/"
    - "xform/^ng$/en/"
    - "xform/^hm$/hen/"
    - "xform/^hng$/heng/"
    - "abbrev/^([bpmfdtnlgkhjqxrzcsyw]).+$/$1/"
    - "xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/"
  alphabet: "23456789zyxwvutsrqponmlkjihgfedcba;"
  delimiter: " '"
  initials: 23456789abcdefghijklmnopqrstuvwxyz
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: emoji
    reset: 1
    states: ["🈚", "🈶"]
  - name: traditionalization
    reset: 0
    states: ["简体", "繁体"]
traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
translator:
  dictionary: pinyin
  enable_completion: true
  enable_encoder: true
  enable_sentence: false
  weight_ordered: true
  enable_user_dict: true
  preedit_format:
    - "xform/([nljqxy])v/$1ü/"
  prism: t9_pinyin
  spelling_hints: 3