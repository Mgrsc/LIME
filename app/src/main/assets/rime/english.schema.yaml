# Rime schema
# encoding: utf-8

schema:
  schema_id: english
  name: English
  version: "1.0"
  author:
    - Bitfennec & RIME Developers
  description: |
    LIME 英文输入方案

switches:
  - name: ascii_mode
    reset: 0
    states: [ English, English ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"

translator:
  dictionary: english
  prism: english
  enable_encoder: false
  enable_sentence: false
  encode_commit_history: false
