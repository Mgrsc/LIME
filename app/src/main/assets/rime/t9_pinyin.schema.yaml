# Rime schema
# encoding: utf-8

schema:
  schema_id: t9_pinyin
  name: 拼音九键
  version: "1.3"
  author:
    - Bitfennec & RIME Developers
  description: |
    LIME 拼音九键输入方案（纯数字23456789编码）

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: emoji
    reset: 1
    states: [ 🈚, 🈶 ]
  - name: traditionalization
    reset: 0
    states: [ 简体, 繁体 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@traditionalize
    - simplifier@emoji
    - uniquifier

traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json

emoji:
  option_name: emoji
  opencc_config: emoji.json

speller:
  alphabet: "23456789zyxwvutsrqponmlkjihgfedcba;"
  initials: "23456789abcdefghijklmnopqrstuvwxyz"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - xform/^m$/mu/
    - xform/^n$/en/
    - xform/^ng$/en/
    - xform/^hm$/hen/
    - xform/^hng$/heng/
    # Derive initials after syllable normalization, before mapping to digits.
    - abbrev/^([bpmfdtnlgkhjqxrzcsyw]).+$/$1/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: pinyin
  prism: t9_pinyin
  enable_completion: true
  spelling_hints: 3
  enable_sentence: false
  weight_ordered: true
  enable_user_dict: true
  enable_encoder: true
  preedit_format:
    - xform/([nljqxy])v/$1ü/
