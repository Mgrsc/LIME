name: Release

on:
  push:
    tags:
      # App releases only. Runtime tags such as v3.0.4-runtime do not match.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Sign & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "missing Actions secret: $name" >&2
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]
          umask 077
          dst="${RUNNER_TEMP}/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$dst"
          [[ -s "$dst" ]]
          echo "RELEASE_STORE_FILE=$dst" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Android SDK packages
        run: bash .github/scripts/install-android-sdk.sh

      - name: Build signed release, unit tests and lint
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest lintRelease --no-daemon -Pkotlin.incremental=false --max-workers=1 --stacktrace

      - name: Run Lexicon & Dictionary Tests
        run: python3 -m unittest discover -s tools/dictionary -p "test_*.py"

      - name: Verify signed APK
        run: bash .github/scripts/verify-release-apk.sh app/build/outputs/apk/release/app-release.apk "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          dir="${RUNNER_TEMP}/release"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$dir/notes.md"
            gh release upload "$tag" "$dir"/lime-*.apk "$dir/SHA256SUMS" --clobber
          else
            gh release create "$tag" \
              "$dir"/lime-*.apk \
              "$dir/SHA256SUMS" \
              --title "$tag" \
              --notes-file "$dir/notes.md" \
              --verify-tag
          fi
