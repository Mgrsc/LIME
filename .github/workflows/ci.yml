name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Android SDK packages
        run: bash .github/scripts/install-android-sdk.sh

      - name: Build APKs, run unit tests and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease --no-daemon -Pkotlin.incremental=false --max-workers=1 --stacktrace

      - name: Run Lexicon & Dictionary Tests
        run: python3 -m unittest discover -s tools/dictionary -p "test_*.py"
